name: Docs

# Builds the Sphinx docs (generated from the docstrings in anza/, Furo theme
# styled like the Anza docs) and deploys them to GitHub Pages
# (https://anzaui.github.io/py/).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install -e .[docs]

      # -W --keep-going: every warning fails the build; -n: so does every
      # reference that does not resolve.
      - name: Build docs
        run: sphinx-build -W --keep-going -n -b html -d "$RUNNER_TEMP/doctrees" docs _site

      # Run the >>> examples in the docstrings.
      - name: Test docstring examples
        run: sphinx-build -W --keep-going -n -b doctest -d "$RUNNER_TEMP/doctrees" docs "$RUNNER_TEMP/doctest"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      # Load every page in headless Chrome under /py/ before deploying: fails on
      # JS errors, failed requests, a missing heading, a stuck loader or a
      # sidebar click that does not navigate.
      - name: Browser check
        run: |
          npm install --no-save --no-audit --no-fund --prefix "$RUNNER_TEMP/pp" puppeteer-core@24.43.1
          PUPPETEER_CORE="$RUNNER_TEMP/pp/node_modules/puppeteer-core/lib/esm/puppeteer/puppeteer-core.js" \
            node docs/check.mjs _site /py

      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
