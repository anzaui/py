# docs/config.toml — manifest for `anza docs` (the Anza docs generator).
# Build the site with docs/build.sh; it needs the anza CLI and the anza repo's
# web/src theme checked out in .anza/ (the docs workflow does both).

[site]
title = "Python engine — Anza"
base = "/py"
out = "_site.raw"

[entry]
home = "index.md"
route = "/py"
landing = false
root_dock = "docs"

[files]
roots = ["."]
include = ["**/*.md"]
exclude = []

[assets]
# Theme folders from the anza repo (checked out at a pinned tag into .anza/).
styles = "../.anza/web/src/styles"
tokens = "../.anza/web/src/tokens"
view_code = "../.anza/web/src/views/code"
docks = "../.anza/web/src/docks"

[seo]
site_name = "Python engine — Anza"
sitemap = false
robots = false
json_ld = false
origin = "https://anzaui.github.io"

[[sidebar.section]]
id = "start"
title = "Getting Started"

[[sidebar.section.items]]
path = "index.md"
label = "Introduction"
order = 0

[[sidebar.section]]
id = "guide"
title = "Guide"

[[sidebar.section.items]]
path = "guide/setup.md"
label = "Setup Options"
order = 0

[[sidebar.section.items]]
path = "guide/rendering.md"
label = "Rendering"
order = 1

[[sidebar.section.items]]
